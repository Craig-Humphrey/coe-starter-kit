name: Jest Tests CI

on: [pull_request]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v2
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.x" # current LTS; matches what's already verified locally (16.x is EOL)

      # Speed up subsequent runs with caching
      - name: Cache node modules
        uses: actions/cache@v3
        env:
          cache-name: cache-node-modules
        with:
          # npm cache files are stored in `~/.npm` on Linux/macOS
          path: ~/.npm
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-
      # Install required deps for action
      - name: Install Dependencies
        working-directory: ./coe-cli
        run: npm install

      # Fail the build if TypeScript doesn't compile - previously unchecked
      - name: Build
        working-directory: ./coe-cli
        run: npm run build

      # Fail the build on lint errors - previously silently no-op'd (missing config + a
      # script bug meant this always reported success regardless of what eslint found)
      - name: Lint
        working-directory: ./coe-cli
        run: npm run lint

      # Finally, run our tests
      - name: Run the tests
        working-directory: ./coe-cli
        run: npm test
