name: Solution Build

# Builds every Dataverse solution project (.cdsproj) to prove they still pack
# into a deployable .zip. Excludes ALMAcceleratorForMakers,
# CenterofExcellenceCoreComponentsTeams, and Theming - those 3 ship sample
# Azure DevOps pipeline templates instead of a .cdsproj and aren't locally
# buildable (see TODO-Craig-Detailed.md #5).

on:
  pull_request:
    paths:
      - "admintaskanalysis_core/**"
      - "ALMAcceleratorSampleSolution/**"
      - "business_value_core/**"
      - "CenterofExcellenceALMAccelerator/**"
      - "CenterofExcellenceAuditComponents/**"
      - "CenterofExcellenceAuditLogs/**"
      - "CenterofExcellenceCoreComponents/**"
      - "CenterofExcellenceInnovationBacklog/**"
      - "CenterofExcellenceNurtureComponents/**"
      - "CenterofExcellencePipelineAccelerator/**"
      - "CommunityCoEUmbrella/**"
      - ".github/workflows/build-solutions.yml"

jobs:
  build:
    runs-on: windows-latest # required: these projects target net462 (SolutionPackager is Windows-only)
    strategy:
      fail-fast: false
      matrix:
        solution:
          - name: admintaskanalysis_core
            path: admintaskanalysis_core/SolutionPackage
          - name: ALMAcceleratorSampleSolution
            path: ALMAcceleratorSampleSolution/SolutionPackage
          - name: business_value_core
            path: business_value_core/SolutionPackage
          - name: CenterofExcellenceALMAccelerator
            path: CenterofExcellenceALMAccelerator/SolutionPackage
          - name: CenterofExcellenceAuditComponents
            path: CenterofExcellenceAuditComponents/SolutionPackage
          - name: CenterofExcellenceAuditLogs
            path: CenterofExcellenceAuditLogs/SolutionPackage
          - name: CenterofExcellenceCoreComponents
            path: CenterofExcellenceCoreComponents/SolutionPackage
          - name: CenterofExcellenceInnovationBacklog
            path: CenterofExcellenceInnovationBacklog/SolutionPackage
          - name: CenterofExcellenceNurtureComponents
            path: CenterofExcellenceNurtureComponents/SolutionPackage
          - name: CenterofExcellencePipelineAccelerator
            path: CenterofExcellencePipelineAccelerator/SolutionPackage
          - name: CommunityCoEUmbrella
            path: CommunityCoEUmbrella
    steps:
      - uses: actions/checkout@v2

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x" # LTS; matches the version verified locally - no version gap to track

      # SolutionPackager's own post-pack cleanup step (deleting its obj\Debug\Metadata
      # scratch folder) used to have no tolerance for a transient Windows file-lock
      # there (MSB3231 - commonly AV/indexer scanning the just-written files), even
      # though the solution zip was already generated by that point. Fixed at the
      # root via ../Directory.Build.targets (auto-imported for every project here),
      # so a plain `dotnet build` is enough - no retry logic needed in the workflow.
      - name: Build solution
        working-directory: ${{ matrix.solution.path }}
        run: dotnet build
